name: splitora_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  firebase_ai: ^3.12.1
  google_fonts: ^8.0.2
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  get: ^4.7.2
  animate_do: ^4.2.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  receipt_reader: ^0.0.7
  razorpay_flutter: ^1.3.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  
# for flutter logo
flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/split.jpg"